name: Build
on:
  push:
    branches:
      - main
  # 支持在 Actions 页面手动点击运行
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 汉化版只构建 Windows，其余平台已于本地化时移除
          - platform: windows-latest
            args: >-


    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 21

      - name: setup bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libx11-dev xorg-dev libglu1-mesa-dev libglib2.0-0

      - name: Setup Cargo dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: shared

      - name: install app dependencies and build it
        run: |
          bun install
          bun run build

      # 汉化版改动：不再使用 tauri-action 创建 GitHub Release。
      # 该步骤依赖 release API，连续失败两次（权限不足 / Server Error），
      # 而对产出安装包而言它并非必要，故改为直接构建 + 上传 artifact。
      - name: Build (Tauri)
        run: bun run tauri build

      - name: List bundle output
        run: ls -R src-tauri/target/release/bundle

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: liquidlauncher-windows-zh-cn
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
